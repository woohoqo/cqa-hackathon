<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход в демо — CQA</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#09261e;color:#f4f3e9;font:16px/1.5 system-ui,sans-serif;padding:24px}
    main{width:min(100%,440px)}.brand{font-size:18px;letter-spacing:.15em;color:#c9ff5c}h1{font-size:42px;line-height:1.1;letter-spacing:-.04em;margin:24px 0 18px}
    p{color:#b9c8bf}label{display:block;margin:28px 0 8px}input,button{width:100%;font:inherit;border-radius:8px;padding:14px 16px}input{background:#f4f3e9;color:#09261e;border:2px solid transparent}
    input:focus{outline:3px solid #c9ff5c;outline-offset:3px}button{border:0;background:#c9ff5c;color:#09261e;font-weight:700;margin-top:18px;cursor:pointer}button:hover{background:#dcff9b}
    .error{color:#ffbeaa;min-height:24px;margin-top:16px}.note{font-size:13px;margin-top:28px}
  </style>
</head>
<body><main>
  <div class="brand">CQA / FREEDOM BROKER</div>
  <h1>Вход в демо</h1>
  <p>Введите пароль, которым с вами поделилась команда.</p>
  <form method="post" action="/demo-login">
    <label for="password">Пароль команды</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">Войти</button>
    <div class="error" role="alert"><!--LOGIN_ERROR--></div>
  </form>
  <p class="note">Общее пространство для демонстрации. Используйте вымышленные диалоги.</p>
</main></body>
</html>
